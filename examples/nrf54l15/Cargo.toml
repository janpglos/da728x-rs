[package]
edition = "2024"
name = "da728x-nrf54l15-examples"
version = "0.1.0"
license = "MIT"
publish = false

[[example]]
name = "simple_dro"
path = "examples/simple_dro.rs"

[[example]]
name = "wideband_melody"
path = "examples/wideband_melody.rs"

[[example]]
name = "simple_waveform"
path = "examples/simple_waveform.rs"

[[example]]
name = "waveform_effects"
path = "examples/waveform_effects.rs"

[[example]]
name = "waveform_memory"
path = "examples/waveform_memory.rs"

[dependencies]
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.9.0", features = ["defmt", "nrf54l15-app-s", "time-driver-grtc", "gpiote", "unstable-pac", "time"] }

da728x = { path = "../../", features = ["debug"] }
da728x-examples-common = { path = "../common" }

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

portable-atomic = "1"
static_cell = "2"

[profile.release]
debug = 2